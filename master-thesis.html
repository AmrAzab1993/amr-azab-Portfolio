<!DOCTYPE html>
<html lang="de" id="html-root" class="scroll-smooth" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masterthesis | Amr Azab, M.Eng.</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        survey: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0284c7',
                            700: '#0369a1',
                            800: '#075985',
                            900: '#0c4a6e',
                        },
                        orangeAccent: '#f97316',
                        darkBg: '#0b1120',
                        darkCard: '#152035',
                        darkBorder: '#1e2d4a'
                    },
                    fontFamily: {
                        sans: ['Inter', 'Cairo', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts & Font Awesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Inter', 'Cairo', sans-serif;
            background-color: #0b1120;
            color: #f1f5f9;
        }
        [dir="rtl"] body {
            font-family: 'Cairo', 'Inter', sans-serif;
        }

        .glass-panel {
            background: rgba(21, 32, 53, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .grid-pattern {
            background-image: radial-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 24px 24px;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0b1120;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e2d4a;
            border-radius: 4px;
        }
    </style>
</head>
<body class="selection:bg-orangeAccent selection:text-white">

    <!-- Navbar الثابت في صفحة الماجستير -->
    <header class="fixed top-0 left-0 right-0 z-50 glass-panel border-b border-slate-800/80">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20 gap-4">
                
                <!-- Logo / Brand -->
                <a href="index.html" class="flex items-center gap-3 group shrink-0">
                    <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-survey-500 to-orangeAccent flex items-center justify-center text-white font-mono font-bold text-xl shadow-lg shadow-orangeAccent/20 group-hover:scale-105 transition-transform">
                        <i class="fa-solid fa-crosshairs text-lg"></i>
                    </div>
                    <div>
                        <span class="text-base sm:text-lg font-bold tracking-tight text-white block leading-tight">Amr Azab <span class="text-orangeAccent text-xs font-mono font-normal">M.Eng.</span></span>
                        <span class="text-xs text-slate-400 font-mono" data-i18n="nav-subtitle">Vermessungsingenieur</span>
                    </div>
                </a>

                <!-- Right Actions & Navigation Buttons -->
                <div class="flex items-center gap-3 shrink-0">
                    
                    <!-- زر الأدوات المساحية (Tools) -->
                    <a href="survey-tools.html" class="px-4 py-2 text-xs font-semibold uppercase tracking-wider text-sky-400 bg-slate-800/90 hover:bg-slate-700 rounded-lg shadow-md transition-all border border-sky-500/30 flex items-center gap-2 whitespace-nowrap">
                        <i class="fa-solid fa-calculator"></i> <span data-i18n="nav-tools">Survey Tools</span>
                    </a>

                    <!-- Language Selector -->
                    <div class="relative hidden sm:block">
                        <select id="langSelect" onchange="changeLanguage(this.value)" class="bg-slate-800/90 text-sky-400 font-mono text-xs font-bold border border-slate-700 px-3 py-2 rounded-lg cursor-pointer outline-none hover:bg-slate-700 transition-all">
                            <option value="de">🇩🇪 DE - Deutsch</option>
                            <option value="en">🇬🇧 EN - English</option>
                            <option value="ar">🇪🇬 AR - العربية</option>
                        </select>
                    </div>

                    <!-- زر العودة للرئيسية -->
                    <a href="index.html" class="px-4 py-2 text-xs font-semibold uppercase tracking-wider text-white bg-gradient-to-r from-survey-600 to-survey-800 hover:from-survey-500 hover:to-survey-700 rounded-lg shadow-md transition-all border border-sky-500/30 flex items-center gap-2 whitespace-nowrap">
                        <i class="fa-solid fa-house"></i> <span data-i18n="nav-home">Home</span>
                    </a>

                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Section -->
    <section class="pt-32 pb-20 min-h-screen grid-pattern flex flex-col items-center justify-center">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 w-full">
            
            <div class="text-center mb-8">
                <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-800/80 border border-slate-700 text-xs font-mono text-sky-400 mb-4">
                    <i class="fa-solid fa-graduation-cap"></i>
                    <span data-i18n="thesis-badge">Scientific Poster • Campus Bridge Mainz</span>
                </div>
                <h1 class="text-3xl sm:text-4xl font-extrabold text-white" data-i18n="thesis-title">Modellierung Technischer Bestandsbauwerke aus 3D-Punktwolken</h1>
            </div>

            <!-- Poster Display Card -->
            <div class="glass-panel p-6 rounded-3xl border border-slate-700/80 shadow-2xl text-center">
                <div class="bg-slate-950 rounded-2xl p-4 overflow-hidden border border-slate-800 flex justify-center">
                    <!-- استبدل الرابط أدناه بملف البوستر الخاص بك إن وجد -->
                    <div class="text-slate-400 py-20 font-mono text-sm">
                        <i class="fa-solid fa-file-pdf text-4xl text-orangeAccent mb-3 block"></i>
                        <span data-i18n="poster-loading">Masterthesis Poster PDF wird geladen...</span>
                    </div>
                </div>
            </div>

        </div>
    </section>

    <!-- Footer -->
    <footer class="py-8 bg-slate-950 border-t border-slate-800 text-center text-xs text-slate-500 font-mono">
        <p>&copy; 2026 Amr Azab, M.Eng. | Masterthesis Campus-Brücke Mainz.</p>
    </footer>

    <!-- Script for language toggle -->
    <script>
        const translations = {
            de: {
                "nav-subtitle": "Vermessungsingenieur",
                "nav-tools": "Survey Tools",
                "nav-home": "Home",
                "thesis-badge": "Wissenschaftliches Poster • Campus-Brücke Mainz",
                "thesis-title": "Modellierung Technischer Bestandsbauwerke aus 3D-Punktwolken",
                "poster-loading": "Masterthesis Poster PDF..."
            },
            en: {
                "nav-subtitle": "Surveying Engineer",
                "nav-tools": "Survey Tools",
                "nav-home": "Home",
                "thesis-badge": "Scientific Poster • Campus Bridge Mainz",
                "thesis-title": "Modeling Technical Structures from 3D Point Clouds",
                "poster-loading": "Master Thesis Poster PDF loading..."
            },
            ar: {
                "nav-subtitle": "مهندس مساحة وجيوماتكس",
                "nav-tools": "الأدوات المساحية",
                "nav-home": "الرئيسية",
                "thesis-badge": "البوستر العلمي • جسر ماينتس الجامعي",
                "thesis-title": "نمذجة المنشآت الهندسية القائمة من سحاب النقاط ثلاثية الأبعاد",
                "poster-loading": "جاري عرض بوستر رسالة الماجستير..."
            }
        };

        function changeLanguage(lang) {
            localStorage.setItem('preferred_lang', lang);
            const htmlRoot = document.getElementById('html-root');
            htmlRoot.setAttribute('lang', lang);
            if (lang === 'ar') {
                htmlRoot.setAttribute('dir', 'rtl');
            } else {
                htmlRoot.setAttribute('dir', 'ltr');
            }
            const langSelect = document.getElementById('langSelect');
            if(langSelect) langSelect.value = lang;

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    el.innerHTML = translations[lang][key];
                }
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('preferred_lang') || 'de';
            changeLanguage(savedLang);
        });
    </script>
</body>
</html>
